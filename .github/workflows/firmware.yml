name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pico 2 W / Zephyr
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Match the revision used by the local Pico extension workspace.
      ZEPHYR_REVISION: a915b2f12675b48b16d56653ea145dcd8f20cbbf
      ZEPHYR_SDK_VERSION: 1.0.1
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out application
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            cmake ninja-build gperf device-tree-compiler wget xz-utils file \
            make gcc g++ libsdl2-dev libmagic1
          python -m pip install 'west==1.5.0'

      - name: Prepare Zephyr workspace
        working-directory: ${{ runner.temp }}
        run: |
          # west 1.5.0 --mr uses git clone --branch, which cannot take a SHA.
          git init zephyr-workspace/zephyr
          git -C zephyr-workspace/zephyr remote add origin \
            https://github.com/zephyrproject-rtos/zephyr
          git -C zephyr-workspace/zephyr fetch --depth=1 origin "$ZEPHYR_REVISION"
          git -C zephyr-workspace/zephyr checkout --detach FETCH_HEAD
          test "$(git -C zephyr-workspace/zephyr rev-parse HEAD)" = "$ZEPHYR_REVISION"
          cd zephyr-workspace
          west init -l zephyr
          west update --narrow -o=--depth=1
          # Install extension dependencies before loading any Zephyr commands.
          python -m pip install -r zephyr/scripts/requirements-base.txt
          west zephyr-export
          west blobs fetch hal_infineon
          west sdk install --version "$ZEPHYR_SDK_VERSION" \
            --gnu-toolchains arm-zephyr-eabi
          echo "ZEPHYR_BASE=$PWD/zephyr" >> "$GITHUB_ENV"

      - name: Create build-only Wi-Fi configuration
        run: |
          cat > src/wifi_env.h <<'EOF'
          #pragma once
          #define APP_WIFI_SSID ""
          #define APP_WIFI_PASSWORD ""
          EOF

      - name: Build firmware
        working-directory: ${{ runner.temp }}/zephyr-workspace
        run: |
          west build --pristine=always --board rpi_pico2/rp2350a/m33_0/w \
            --build-dir "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: pico2-w-firmware-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/zephyr/zephyr.elf
            build/zephyr/zephyr.uf2
            build/zephyr/zephyr.bin
